include:
  - project: "neuraverse/neuraverse-pipelines"
    file: "/SAST_TAG_BUILDKIT_UPDATE_MANIFEST.gitlab-ci.yml"
  
# Global variables
variables:
  APPLICATION_NAME: neuraverse-YOUR_NODE_NAME-node
  APPLICATION_PORT: 8500
  EXTRA_DOCKER_BUILD_ARGS: "--opt build-arg:CI_JOB_TOKEN=$CI_JOB_TOKEN --secret id=CI_JOB_TOKEN,env=CI_JOB_TOKEN"
  GITLAB_DOMAIN: "gitlab.hrg.systems"
  IMAGE_FILE_PATH: "gateway/apps/neuraverse-YOUR_NODE_NAME-node/values.yaml"
  YQ_PATH: ".deployment.image.tag"
