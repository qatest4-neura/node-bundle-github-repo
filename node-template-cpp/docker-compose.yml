services:
  neuraverse-node-template-cpp:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - MQTT_BROKER_HOST=localhost
      - MQTT_BROKER_PORT=1883
      - CONSUL_ENDPOINT=localhost:8500
      - NODE_ADVERTISE_HOST=localhost
      - NODE_GRPC_PORT=50081
      - NODE_HTTP_PORT=8081
    network_mode: host
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
